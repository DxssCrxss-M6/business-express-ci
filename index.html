<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Express CI</title>
<style>
:root{--bg:#FAFAF7;--tx:#17201B;--mu:#4A554E;--bd:#D9DDD8;--cd:#fff;--nv:#0B1F4B;--or:#F77F00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1420;--tx:#EEF1F7;--mu:#A9B2C3;--bd:#2A3350;--cd:#182036;--nv:#1B2E66;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
header{background:var(--nv);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:19px}
main{max-width:560px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{margin:4px 0}
input,textarea,select{width:100%;box-sizing:border-box;min-height:44px;padding:8px 12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx)}
button{min-height:48px;font-size:16px;font-weight:700;border-radius:12px;padding:0 16px;border:0}
header button{min-height:40px;background:var(--or);color:#17201B}
.btn{background:var(--or);color:#17201B}
.btn2{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.lnk{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box;min-height:48px;border-radius:12px;font-weight:700}
section{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
#list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.card{min-height:0;padding:8px;font-weight:400;text-align:left;background:var(--cd);border:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;color:var(--tx);font-size:15px}
button.card b{font-size:16px}
.mu{color:var(--mu);margin:0;font-size:14px}
.strip{display:flex;gap:8px;overflow-x:auto}
.strip img{height:200px;width:auto;border-radius:8px;flex:none}
[hidden]{display:none!important}
</style></head>
<body>
<header><h1>Business Express CI</h1><button id="top" type="button">Connexion</button></header>
<main>
<section id="authp" hidden>
<h2>Connexion</h2>
<input id="em" type="email" placeholder="E-mail" autocomplete="email">
<input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password">
<button class="btn" id="login" type="button">Se connecter</button>
<button class="btn2" id="signup" type="button">Créer un compte</button>
<p class="mu" id="amsg"></p>
</section>
<section id="sellp" hidden>
<h2>Publier une annonce</h2>
<p class="mu" id="who"></p>
<label>Photos (4 maximum)<input id="ph" type="file" accept="image/*" multiple></label>
<div class="strip" id="pv"></div>
<label>Titre<input id="ti" type="text" maxlength="80"></label>
<label>Catégorie<select id="ca"></select></label>
<label>Ville<select id="vi"></select></label>
<label>Prix (FCFA)<input id="pr" type="number" inputmode="numeric"></label>
<label>Type de prix<select id="un"></select></label>
<label>Description<textarea id="de" rows="3" maxlength="500"></textarea></label>
<label>Lien (facultatif : extrait du livre, page de la résidence…)<input id="li" type="url" placeholder="https://"></label>
<label>Ton nom<input id="se" type="text" maxlength="40"></label>
<label>Ton numéro (WhatsApp)<input id="tel" type="tel" placeholder="0707070707"></label>
<button class="btn" id="go" type="button">Publier mon annonce</button>
<p class="mu" id="msg"></p>
<button class="btn2" id="logout" type="button">Se déconnecter</button>
</section>
<input id="q" type="text" placeholder="Rechercher une annonce…" aria-label="Rechercher">
<div class="row"><select id="fc" aria-label="Catégorie"></select><select id="fv" aria-label="Ville"></select></div>
<section id="detail" hidden></section>
<div id="list"></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,collection,addDoc,onSnapshot,query,orderBy,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const app=initializeApp({
  apiKey:"AIzaSyC4DsEYJOfILmytTRfgaPr1QymJGgp-87o",
  authDomain:"business-express-ci.firebaseapp.com",
  projectId:"business-express-ci",
  storageBucket:"business-express-ci.firebasestorage.app",
  messagingSenderId:"45446517286",
  appId:"1:45446517286:web:1aaf5de2d58429b61e4ce7"
});
const auth=getAuth(app),db=getFirestore(app);
const CATS=['Téléphones','Électronique','Mode','Maison','Véhicules','Immobilier','Services','Livres & formations','Autres'];
const CITIES=['Abidjan','Bouaké','Yamoussoukro','Daloa','San-Pédro','Korhogo','Autre'];
const UNITS=[['','Prix fixe'],['par mois','Par mois'],['par nuit','Par nuit'],['par jour','Par jour']];
let items=[],user=null,photos=[];
const $=i=>document.getElementById(i);
const msg=t=>{$('msg').textContent=t};
function el(t,x,c){const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e}
function opts(id,list,all){const s=$(id);if(all)s.append(new Option(all,''));list.forEach(v=>s.append(new Option(v,v)))}
opts('fc',CATS,'Toutes les catégories');opts('fv',CITIES,'Toutes les villes');opts('ca',CATS);opts('vi',CITIES);
UNITS.forEach(u=>$('un').append(new Option(u[1],u[0])));
const money=i=>Number(i.price).toLocaleString('fr-FR')+' FCFA'+(i.unit?' '+i.unit:'');
function phone(p){let d=p.replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===10)d='225'+d;return /^\d{11,13}$/.test(d)?d:null}
function shrink(file){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.6))};im.onerror=ko;im.src=r.result};r.onerror=ko;r.readAsDataURL(file)})}
function pics(i){return (Array.isArray(i.photos)&&i.photos.length?i.photos:(i.photo?[i.photo]:[])).filter(s=>String(s).startsWith('data:image/'))}
function pic(i,h){
  const a=pics(i);
  if(a.length){const m=document.createElement('img');m.src=a[0];m.alt=i.title||'';m.style.cssText='width:100%;height:'+h+'px;object-fit:cover;border-radius:8px';return m}
  const d=el('div','Pas de photo','mu');d.style.cssText='height:'+h+'px;display:flex;align-items:center;justify-content:center;background:var(--bd);border-radius:8px';return d;
}
function render(){
  const q=$('q').value.toLowerCase(),c=$('fc').value,v=$('fv').value,l=$('list');l.replaceChildren();
  const f=items.filter(i=>(!c||i.cat===c)&&(!v||i.city===v)&&((i.title||'')+' '+(i.desc||'')).toLowerCase().includes(q));
  if(!f.length){l.append(el('p','Aucune annonce pour l’instant.','mu'));return}
  f.forEach(i=>{const k=el('button',null,'card');k.type='button';k.append(pic(i,120),el('b',money(i)),el('span',i.title),el('span',(i.city||'')+' · '+(i.cat||''),'mu'));k.onclick=()=>show(i);l.append(k)});
}
function show(i){
  const p=$('detail');p.hidden=false;p.replaceChildren();
  const x=el('button','Fermer','btn2');x.type='button';x.onclick=()=>{p.hidden=true};
  p.append(x);
  const a=pics(i);
  if(a.length>1){const s=el('div',null,'strip');a.forEach(u=>{const m=document.createElement('img');m.src=u;m.alt=i.title||'';s.append(m)});p.append(s)}
  else p.append(pic(i,240));
  p.append(el('h2',money(i)),el('b',i.title),el('p',i.desc,'mu'),el('p',(i.city||'')+' · '+(i.cat||'')+' · '+(i.seller||''),'mu'));
  if(/^https?:\/\//.test(i.link||'')){const k=el('a','Voir le lien','btn2 lnk');k.href=i.link;k.target='_blank';k.rel='noopener noreferrer';p.append(k)}
  const n=String(i.phone||'');
  if(/^\d{11,13}$/.test(n)){
    const t=el('a','Appeler','btn lnk');t.href='tel:+'+n;
    const w=el('a','WhatsApp','btn lnk');w.href='https://wa.me/'+n+'?text='+encodeURIComponent('Bonjour, je suis intéressé par ton annonce « '+i.title+' » sur Business Express CI.');w.target='_blank';w.rel='noopener';
    p.append(t,w);
  }
  if(user&&user.uid===i.uid){
    const d=el('button','Supprimer mon annonce','btn2');d.type='button';
    d.onclick=async()=>{if(confirm('Supprimer cette annonce ?')){await deleteDoc(doc(db,'products',i.id));p.hidden=true}};
    p.append(d);
  }
  p.scrollIntoView();
}
function err(e){
  const c=e&&e.code||'';
  $('amsg').textContent=c.includes('email-already')?'Cet e-mail a déjà un compte.':
    c.includes('weak')?'Mot de passe trop court (6 minimum).':
    c.includes('invalid')?'E-mail ou mot de passe incorrect.':'Une erreur est survenue, réessaie.';
}
['q','fc','fv'].forEach(k=>{$(k).oninput=render});
$('top').onclick=()=>{if(user){$('sellp').hidden=!$('sellp').hidden}else{$('authp').hidden=!$('authp').hidden}};
$('login').onclick=()=>signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value).catch(err);
$('signup').onclick=()=>createUserWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value).catch(err);
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  user=u;$('amsg').textContent='';
  $('top').textContent=u?'Vendre':'Connexion';
  $('authp').hidden=true;$('sellp').hidden=!u;
  if(u)$('who').textContent='Connecté : '+u.email;
  render();
});
$('ph').onchange=async e=>{
  const fl=Array.from(e.target.files);photos=[];$('pv').replaceChildren();
  if(fl.length>4)msg('4 photos maximum : seules les 4 premières sont gardées.');
  for(const f of fl.slice(0,4)){
    try{const d=await shrink(f);photos.push(d);const m=document.createElement('img');m.src=d;$('pv').append(m)}
    catch(x){msg('Une photo est illisible, essaie une autre.')}
  }
};
$('go').onclick=async()=>{
  const v=k=>$(k).value.trim(),price=parseInt(v('pr'),10),n=phone(v('tel')),lk=v('li');
  if(!user)return;
  if(!v('ti')||!(price>0)){msg('Mets un titre et un prix.');return}
  if(!n){msg('Numéro invalide (10 chiffres, ex : 0707070707).');return}
  if(lk&&!/^https?:\/\//.test(lk)){msg('Le lien doit commencer par https://');return}
  try{
    await addDoc(collection(db,'products'),{title:v('ti'),desc:v('de'),price:price,unit:$('un').value,cat:$('ca').value,city:$('vi').value,phone:n,seller:v('se')||'Vendeur',link:lk,photos:photos,photo:photos[0]||'',uid:user.uid,t:Date.now()});
    msg('Annonce publiée ✓');
    ['ti','de','pr','se','tel','li'].forEach(k=>{$(k).value=''});$('ph').value='';$('pv').replaceChildren();photos=[];
  }catch(e){msg('Impossible de publier (photos trop lourdes ? essaie avec moins de photos).')}
};
onSnapshot(query(collection(db,'products'),orderBy('t','desc')),
  s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()},
  ()=>{$('list').replaceChildren(el('p','Impossible de charger les annonces.','mu'))});
render();
</script>
</body></html>
